# 推到 main 時自動建置並發布到 GitHub Pages
name: deploy-book
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  BASE_URL: /${{ github.event.repository.name }}
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/run_validations.py
      - run: python tools/add_embed_mode.py
      - run: python widgets/build.py
      - run: jupyter book build --html
      # 原型互動頁以 iframe 嵌入各章，要一起放進網站
      - run: cp -r prototypes _build/html/prototypes
      # 英文版：產生英文原型頁與元件，建置 en/，放到網站的 /en/ 底下
      - run: python tools/build_en.py
      - run: jupyter book build --html
        working-directory: en
        env:
          BASE_URL: /${{ github.event.repository.name }}/en
      - run: |
          cp -r en/_build/html _build/html/en
          cp -r en/prototypes _build/html/en/prototypes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
